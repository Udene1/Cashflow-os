name: One-off lead update

on:
  push:
    branches: [main]

jobs:
  update:
    if: startsWith(github.event.head_commit.message, '[lead-update]')
    runs-on: ubuntu-latest
    steps:
      - name: Update European Dynamics lead
        env:
          BASE: https://cashflow-os-silk.vercel.app
          LEAD_ID: e764abe1-df63-4423-8af9-4490e3211a1c
        run: |
          set -euo pipefail

          curl --fail-with-body -sS -X POST "$BASE/api/leads/$LEAD_ID/research" \
            -H 'content-type: application/json' \
            --data @- <<'JSON'
          {
            "researchSummary":"European Dynamics has a current Strasbourg Operations Support Engineer opening tied to a major client's IT team. The role covers operational continuity, L2 incident/problem/service-request support, monitoring, deployments, change/release work, rollback planning, root-cause analysis, vulnerability remediation, runbooks and knowledge transfer. Public hiring activity also shows Strasbourg openings for DevSecOps, Database Administrator and Change & Release Coordinator roles, all describing work with a major client IT team. This is evidence of an active delivery/operations staffing need; the underlying business pain is a hypothesis, not a confirmed customer statement.",
            "technicalArea":"IT operations, DevSecOps, change/release management, observability, incident management, infrastructure automation and operational evidence",
            "evidence":[
              "Operations Support Engineer opening in Strasbourg says the engineer will maintain operational continuity, stability, security and performance and provide L2 incident/problem/service-request support.",
              "The same opening covers observability alerts, deployments, automation, changes, releases, rollback planning, root-cause analysis, vulnerability remediation, runbooks and knowledge transfer.",
              "European Dynamics also has a current Strasbourg DevSecOps Engineer opening involving DevSecOps pipelines, continuous delivery, automation and monitoring.",
              "European Dynamics also has a Strasbourg Database Administrator opening covering database monitoring/tuning, incident management, security, auditing configuration and disaster recovery tests.",
              "European Dynamics has a Strasbourg Change & Release Coordinator opening covering live-service changes/releases, version control, KPIs, DevSecOps coordination and transition into business-as-usual.",
              "The Strasbourg roles repeatedly state that the first assignment works closely with a major client's IT team."
            ],
            "hypotheses":[
              "The concentration of operations, DevSecOps, DBA and change/release hiring may indicate a substantial operational workload around a live client environment.",
              "There may be an opportunity to reduce manual coordination/evidence work around incidents, changes, releases and operational controls, but this must be validated with the team."
            ],
            "confidence":"high",
            "potentialProblem":"Hypothesis: operational coordination and evidence across incidents, changes, releases and infrastructure may be creating manual work or visibility gaps in a live client environment.",
            "targetContacts":[
              {
                "name":"Nassos Michas",
                "role":"Chief Technology Officer",
                "reason":"Public sources identify him as European Dynamics' CTO; the Strasbourg hiring cluster spans operations, DevSecOps, database and change/release work, making technology leadership a plausible owner for validating whether there is an operational automation or evidence problem."
              }
            ],
            "whyContact":"He is the documented technology executive and can validate whether the Strasbourg operational hiring reflects a problem worth solving beyond simply filling roles.",
            "nextAction":"Contact Nassos Michas with a short evidence-led message; ask whether the Strasbourg operations/change/release workload has a manual coordination or evidence bottleneck before proposing a specific product.",
            "sources":[
              {"title":"EUROPEAN DYNAMICS Operations Support Engineer","url":"https://www.eurodyn.com/careers/"},
              {"title":"Operations Support Engineer — Indeed","url":"https://fr.indeed.com/viewjob?jk=032114b3bb643222"},
              {"title":"Change & Release Coordinator — Built In","url":"https://builtin.com/job/change-release-coordinator/10544903"},
              {"title":"DevSecOps Engineer — LinkedIn","url":"https://fr.linkedin.com/jobs/view/devsecops-engineer-at-european-dynamics-4461723711"},
              {"title":"Database Administrator — LinkedIn","url":"https://fr.linkedin.com/jobs/view/database-administrator-at-european-dynamics-4461708993"},
              {"title":"Nassos Michas — LinkedIn","url":"https://gr.linkedin.com/in/nassosmichas"}
            ],
            "confirmation":"approved"
          }
          JSON

          curl --fail-with-body -sS -X PATCH "$BASE/api/leads" \
            -H 'content-type: application/json' \
            --data @- <<'JSON'
          {
            "id":"e764abe1-df63-4423-8af9-4490e3211a1c",
            "nextAction":"Contact Nassos Michas by email; validate whether the Strasbourg operations/change/release workload has a manual coordination or evidence bottleneck before proposing a specific solution.",
            "decisionMaker":"Likely",
            "notes":"Research completed 2026-09-20. Evidence: current Strasbourg hiring spans Operations Support, DevSecOps, Database Administration and Change & Release, repeatedly tied to a major client IT team. Problem remains a hypothesis; validate before offering."
          }
          JSON

          echo "Lead update completed."
