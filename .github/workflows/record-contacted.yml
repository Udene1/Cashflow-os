name: Record sent lead contact
on:
  push:
    branches: [main]
jobs:
  update:
    if: startsWith(github.event.head_commit.message, '[record-contacted]')
    runs-on: ubuntu-latest
    steps:
      - env:
          BASE: https://cashflow-os-silk.vercel.app
          ID: e764abe1-df63-4423-8af9-4490e3211a1c
        run: |
          curl --fail-with-body -sS -X PATCH "$BASE/api/leads" -H 'content-type: application/json' --data '{"id":"e764abe1-df63-4423-8af9-4490e3211a1c","status":"Contacted","decisionMaker":"Likely","nextAction":"Wait for Nassos Michas response; if no response, follow up after a reasonable interval.","notes":"Research completed and email sent 2026-09-20 to Nassos Michas using subject: Strasbourg operations workload. Contact confirmed by user."}'
