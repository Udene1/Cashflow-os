name: Record researched procurement opportunities
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-procurement-opportunities.yml']
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Record five opportunities
        env:
          PAYLOAD: '{"name":"Yobe State Government — multi-vehicle procurement","company":"Yobe State Government","role":"Procurement / SSG Office","problem":"Supply of 1 Toyota Prado V6 2026, 1 Toyota Hilux Adventure, 1 Toyota Prado LEAD 2023, 1 armored Toyota Prado 2026, 2 Toyota Hilux 2023 and 2 Toyota Prado 2026; deadline 30 Sep 2026 at 12:00 noon.","source":"Public Procurement NG — Yobe vehicle invitation to bid","sourceUrl":"https://publicprocurement.org/yobe-state-office-of-the-secretary-to-the-state-government-invitation-to-bid-for-the-supply-of-vehicles/","nextAction":"Verify bid documents and vendor requirements; identify capable vehicle supplier/dealer; confirm stock/specs; assess bank/credit and insurance attachment; identify procurement owner. No outreach yet.","urgency":"High","decisionMaker":"Unknown","budget":"Unknown","timeline":"Bid deadline 30 Sep 2026 at 12:00 noon","notes":"Eligibility includes CAC, tax clearance, audited accounts, company profile, financial capability including bank reference for credit facility if needed, and Yobe State Bureau on Public Procurement registration. Supplier route to verify: Toyota supplier for mixed Prado/Hilux specs including armored vehicle. Finance/insurance are plausible attached offers, not confirmed buyer requests.","signal":"Public procurement signal","leadScore":95,"confirmation":"approved"},{"name":"Gombe AGILE-AF — school solar power procurement","company":"Gombe State AGILE-AF","role":"Procurement / Project Management","problem":"Procurement, distribution and installation of 10kVA solar power to 26 newly constructed secondary schools plus 55 additional senior secondary schools for digital skills, Phase II; RFB NG-GOMBE AGILE ADF-551281-GO-RFB; Credit 74060-NG; 90-day delivery; deadline 30 Sep 2026 at 12:00pm.","source":"World Bank procurement notice — Gombe AGILE-AF","sourceUrl":"https://freetender.net/tender/procurement-and-distribution-of-10kva-solar-power-to-newly-constructed-26-secondary-school-op00469820","nextAction":"Obtain official bid document; verify technical/eligibility requirements; qualify Nigerian solar EPC/supplier; verify Dr. Amina Haruna Abdul contact against bid document before outreach. No outreach yet.","urgency":"High","decisionMaker":"Dr. Amina Haruna Abdul (secondary reproduction; verify)","budget":"Not disclosed","timeline":"90-day delivery; bid deadline 30 Sep 2026","notes":"Supplier route: Nigerian solar EPC/integrator with institutional-school capacity; ATOM Energies is a candidate to qualify, not confirmed. Secondary material lists 08137340873 / abdulamina10@gmail.com; verify before use. Supplier eligibility unverified.","signal":"Public procurement signal","leadScore":96,"confirmation":"approved"},{"name":"UNICEF Nigeria — nationwide inland transportation services","company":"UNICEF Nigeria","role":"Procurement / Supply & Logistics","problem":"EOI for nationwide inland transportation of programme supplies from ports and warehouses to destinations across Nigeria, including remote/hard-to-reach locations; long-term agreements; REOI-NGR-2026-09-02; deadline 2 Oct 2026.","source":"UNGM — UNICEF Nigeria REOI","sourceUrl":"https://www.ungm.org/Public/Notice/314026","nextAction":"Qualify haulage/logistics provider for fleet, nationwide coverage, remote delivery and relevant experience; verify UN/NGO and UNGM readiness; approach supplier first, then route qualified capability to UNICEF. No outreach yet.","urgency":"High","decisionMaker":"Kenneth Ibezim — oibezim@unicef.org","budget":"Not disclosed at EOI stage","timeline":"EOI deadline 2 Oct 2026","notes":"Supplier candidates: JMG Haulage, W.A. Lawal Investment, Fitzgerald Meelk; all require qualification for actual fleet, coverage, experience and UNGM readiness. Buyer demand is explicit. Do not claim any candidate is qualified until verified.","signal":"Public procurement signal","leadScore":94,"confirmation":"approved"},{"name":"ANRiN 2.0 — RUTF procurement","company":"ANRiN 2.0 Project Management Unit","role":"Procurement / Nutrition Programme","problem":"RFB for Basic Packages of Nutrition Services — Ready-to-Use Therapeutic Foods (RUTF), NG-PMU-2.0-569104-GO-RFB, Credit CR-IDA-77440; deadline 4 Nov 2026; bid security USD 236,000 from a commercial bank.","source":"World Bank procurement notice — ANRiN 2.0 RUTF","sourceUrl":"https://freetender.net/tender/procurement-of-bpns-commodity-ready-to-use-therapeutic-food-rutf-op00469772","nextAction":"Obtain official bid docs; verify product, certification, manufacturing/import and bid-security requirements; qualify RUTF supplier; verify PMU procurement contact from bid document before outreach. No outreach yet.","urgency":"High","decisionMaker":"Dr. Dogara Okara (secondary research; verify)","budget":"Not disclosed; bid security USD 236,000","timeline":"Bid deadline 4 Nov 2026","notes":"Supplier candidates: NUTRIK FZE / Nutriset Group and DABS Nutritional Products, requiring verification of capacity, certifications and tender eligibility. Secondary research surfaced Dr. Dogara Okara, +234 803 450 4889, okaradb@gmail.com, plus alikaliom@yahoo.com and anrinpmu@anrinproject.com.ng; verify against official bid docs. No supplier is represented yet.","signal":"Public procurement signal","leadScore":97,"confirmation":"approved"}]'
        run: |
          set -e
          for i in {1..10}; do
            code=$(curl -sS -o /tmp/response -w '%{http_code}' --get 'https://cashflow-os-silk.vercel.app/api/agent/opportunity' --data-urlencode "payload=$PAYLOAD")
            cat /tmp/response
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          exit 1
